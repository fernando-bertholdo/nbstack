<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;padding:0;background:#04050a;overflow:hidden}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1280" height="640"></canvas>
<script>
const W=1280,H=640;
const cv=document.getElementById('c');const x=cv.getContext('2d');
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
let SEED=7;const rnd=mulberry32(SEED);
function rr(a,b){return a+(b-a)*rnd()}
const COL=[[34,211,238],[138,72,226],[217,119,87]];
function lerp(a,b,t){return a+(b-a)*t}
function pal(t){t=Math.max(0,Math.min(1,t));let seg=t*2;let i=Math.floor(seg);i=Math.min(1,i);let f=seg-i;let a=COL[i],b=COL[i+1];return[lerp(a[0],b[0],f),lerp(a[1],b[1],f),lerp(a[2],b[2],f)]}
// background
let g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#05060d');g.addColorStop(0.5,'#070a16');g.addColorStop(1,'#040509');
x.fillStyle=g;x.fillRect(0,0,W,H);
// flow field
function field(px,py){let n=Math.sin(px*0.0042+Math.cos(py*0.0031))*1.3+Math.cos(py*0.0052-Math.sin(px*0.0026))*1.1+Math.sin((px+py)*0.0019)*0.9;return n*Math.PI}
x.globalCompositeOperation='lighter';
const NP=3200,STEPS=200;
for(let p=0;p<NP;p++){
  let px=rr(-60,W+60),py=rr(-60,H+60);let ci=rr(0,1);
  let col=pal((px/W)*0.7+ci*0.3);let alpha=rr(0.012,0.05);
  x.strokeStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+alpha+')';
  x.lineWidth=rr(0.5,1.4);x.beginPath();x.moveTo(px,py);
  for(let s=0;s<STEPS;s++){let a=field(px,py);px+=Math.cos(a)*1.6;py+=Math.sin(a)*1.6;if(px<-70||px>W+70||py<-70||py>H+70)break;x.lineTo(px,py)}
  x.stroke();
}
// node network
let nodes=[];const NN=16;
for(let i=0;i<NN;i++){nodes.push({x:rr(70,W-70),y:rr(60,H-60),hub:false})}
let hubs=[{x:W*0.18,y:H*0.32},{x:W*0.42,y:H*0.7},{x:W*0.72,y:H*0.28},{x:W*0.86,y:H*0.62}];
hubs.forEach(h=>nodes.push({x:h.x,y:h.y,hub:true}));
for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){
  let dx=nodes[i].x-nodes[j].x,dy=nodes[i].y-nodes[j].y,d=Math.hypot(dx,dy);
  if(d<235){let t=nodes[i].x/W;let col=pal(0.2+t*0.6);let a=(1-d/235)*0.3;
    x.strokeStyle='rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+a+')';x.lineWidth=0.8;
    x.beginPath();x.moveTo(nodes[i].x,nodes[i].y);x.lineTo(nodes[j].x,nodes[j].y);x.stroke()}
}
nodes.forEach(n=>{let col=pal(n.x/W);let R=n.hub?34:16;
  let rg=x.createRadialGradient(n.x,n.y,0,n.x,n.y,R);
  rg.addColorStop(0,'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+','+(n.hub?0.9:0.55)+')');
  rg.addColorStop(1,'rgba('+(col[0]|0)+','+(col[1]|0)+','+(col[2]|0)+',0)');
  x.fillStyle=rg;x.beginPath();x.arc(n.x,n.y,R,0,7);x.fill();
  x.fillStyle='rgba(255,255,255,'+(n.hub?0.95:0.8)+')';x.beginPath();x.arc(n.x,n.y,n.hub?2.4:1.3,0,7);x.fill()});
// text scrim
x.globalCompositeOperation='source-over';
let sg=x.createLinearGradient(0,H*0.26,0,H*0.84);
sg.addColorStop(0,'rgba(4,5,12,0)');sg.addColorStop(0.5,'rgba(4,5,12,0.66)');sg.addColorStop(1,'rgba(4,5,12,0)');
x.fillStyle=sg;x.fillRect(0,H*0.22,W,H*0.62);
// title
x.textAlign='center';
x.shadowColor='rgba(138,72,226,0.55)';x.shadowBlur=26;
x.fillStyle='#f4f6ff';x.font='700 78px "Helvetica Neue",Arial,sans-serif';
x.fillText('nbstack',W/2,H*0.46);
x.shadowBlur=0;
// subtitle
x.fillStyle='#a4b4d8';x.font='400 28px "Helvetica Neue",Arial,sans-serif';
x.fillText('Claude Code Plugin Marketplace',W/2,H*0.46+46);
// accent rule
let rw=220;x.strokeStyle='rgba(217,119,87,0.95)';x.lineWidth=2;
x.beginPath();x.moveTo(W/2-rw/2,H*0.46+74);x.lineTo(W/2+rw/2,H*0.46+74);x.stroke();
// install mono
x.fillStyle='rgba(150,170,210,0.72)';x.font='400 17px "SF Mono",Menlo,monospace';
x.fillText('/plugin marketplace add fernando-bertholdo/nbstack',W/2,H*0.85);
</script></body></html>
